<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Consulta Creditos - Aquaworld Systems/title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">

    <style>

        body{
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            background:#f0f8ff;
            margin:0;
            padding:0;
        }

        .container{
            max-width:600px;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,.1);
            text-align:center;
        }

        h2{
            color:#023e8a;
            margin-bottom:20px;
        }

        h3{
            color:#023e8a;
        }

        input[type=file]{

            width:80%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;

        }

        button{

            margin-top:15px;
            padding:12px 25px;

            background:#0077b6;
            color:white;

            border:none;
            border-radius:5px;

            cursor:pointer;

            font-size:16px;

        }

        button:hover{

            background:#0096c7;

        }

        .result{

            margin-top:25px;

            background:#caf0f8;

            border-radius:8px;

            padding:20px;

            text-align:left;

        }

        .result p{

            margin:8px 0;

            font-size:16px;

        }

        .error{

            margin-top:20px;

            background:#ffdede;

            color:#b00020;

            padding:15px;

            border-radius:8px;

            font-weight:bold;

        }

        footer{

            margin-top:25px;

            text-align:right;

            color:#666;

            font-size:12px;

        }

        /*Barra  de Nivel de riesgo*/

        .barra-riesgo{
            width:100%;
            height:14px;
            background:#ddd;
            border-radius:10px;
            overflow:hidden;
            margin-top:5px;
        }

        .progreso{
            height:100%;
            transition:.4s;
        }

        .bajo{
            width:100%;
            background:#2e7d32;
        }

        .medio{
            width:60%;
            background:#f9a825;
        }

        .alto{
            width:25%;
            background:#c62828;
        }
    </style>

</head>

<body>

<div class="container">

    <img src="https://i.ibb.co/0pDvPK0m/aquaworldsystem.png"
         style="width:40%;">

    <h2>Subir reporte de crédito TransUnion (PDF)</h2>

    <form method="POST" enctype="multipart/form-data">

        <input
            type="file"
            name="pdf"
            accept=".pdf"
            required>

        <br>

        <button type="submit">
            Procesar
        </button>

    </form>

    {% if error %}

        <div class="error">

            {{ error }}

        </div>

    {% endif %}


     {% if clientes %}

    <div style="display:flex; gap:20px; justify-content:center; flex-wrap:wrap; margin-top:25px;">

    {% for cliente in clientes %}

    <div class="result" style="flex:1; min-width:250px; max-width:280px;">

    {% if loop.index == 1 %}
        <h3>Aplicante</h3>
    {% else %}
        <h3>Coaplicante</h3>
    {% endif %}

        <p>
            <b>Nombre completo:</b><br>
            {{ cliente.nombre }}
        </p>

        <p>
            <b>Score:</b><br>
            {{ cliente.score }}
        </p>

        <p>
            <b>Gastos ($):</b><br>
            {{ cliente.gastos }}
        </p>

        <p>
            <b>Límite total de crédito:</b><br>
            ${{ "{:,.0f}".format(cliente.limite_credito) }}
        </p>

        <p>
            <b>Cuentas abiertas:</b><br>
            {{ cliente.cuentas_abiertas }}
        </p>

        <p>
            <b>Colecciones:</b><br>
            {{ cliente.collections }}
        </p>

        <p>
            <b>Charge Offs:</b><br>
            {{ cliente.charge_offs }}
        </p>

        <p>
            <b>Disputas:</b><br>
            {{ cliente.disputes }}
        </p>

        <p>
            <b>Consultas al historial crediticio (2026):</b><br>
            {{ cliente.inquiries }}
        </p>

        <p>
            <b>Nivel de riesgo crediticio:</b><br>

            {% if cliente.riesgo == "Bajo" %}
                🟢 {{ cliente.riesgo }}
            {% elif cliente.riesgo == "Medio" %}
                🟡 {{ cliente.riesgo }}
            {% else %}
                🔴 {{ cliente.riesgo }}
            {% endif %}
        </p>
        
        <div class="barra-riesgo">
        <div class="progreso {{ cliente.riesgo | lower | replace(' ', '-') }}"></div>
        </div>

    </div>

    {% endfor %}

    </div>

    {% endif %}   


    <footer>

        by Anderson Pupuche

    </footer>

</div>


</body>
</html>
